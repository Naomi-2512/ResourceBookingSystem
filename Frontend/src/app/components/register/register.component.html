  <app-notification></app-notification>
  <div class="register-container">
    <div class="form-container">
      <div class="form-header">
        <h1>Create Account</h1>
        <p>Join our campus resource booking system</p>
      </div>
  
      <form class="register-form" #registerForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="profile-image-container">
          <div class="profile-image" id="profile-preview"
            [style.background-image]="user.profileImage ? 'url(' + user.profileImage + ')' : ''">
            <i class="profile-icon" *ngIf="!user.profileImage">👤</i>
          </div>
          <div class="upload-btn-wrapper">
            <button class="btn-upload" type="button">Upload Photo</button>
            <input type="file" name="profileImage" id="profileImage" accept="image/*" (change)="onFileChange($event)" />
          </div>
        </div>
  
        <div class="form-grid">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Enter your first name"
              [(ngModel)]="user.firstName" required />
          </div>
  
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Enter your last name"
              [(ngModel)]="user.lastName" required />
          </div>
  
          <div class="form-group">
            <label for="phone1">Primary Phone</label>
            <input type="tel" id="phone1" name="phone1" placeholder="Enter your primary phone" [(ngModel)]="user.phone1"
              required />
          </div>
  
          <div class="form-group">
            <label for="phone2">Secondary Phone (Optional)</label>
            <input type="tel" id="phone2" name="phone2" placeholder="Enter your secondary phone"
              [(ngModel)]="user.phone2" />
          </div>
  
          <div class="form-group full-width">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" [(ngModel)]="user.email"
              required email />
          </div>
  
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input">
              <input type="password" id="password" name="password" placeholder="Create a password"
                [(ngModel)]="user.password" required />
              <span class="toggle-password">👁️</span>
            </div>
          </div>
  
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-input">
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password"
                [(ngModel)]="confirmPassword" required />
              <span class="toggle-password">👁️</span>
            </div>
          </div>
  
          <div class="form-group full-width">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="Enter your location" [(ngModel)]="user.location"
              required />
          </div>
        </div>
  
        <button type="submit" class="submit-btn" [disabled]="!registerForm.valid">Create Account</button>
  
        <div class="login-link">
          <p>Already have an account? <a routerLink="/login" class="anchor">Login here</a></p>
        </div>
        <div class="login-link">
          <a routerLink="" class="anchor">Home</a>
        </div>
      </form>
    </div>
  </div>
