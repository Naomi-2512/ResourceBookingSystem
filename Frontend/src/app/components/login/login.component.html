<div class="login-container">
    <div class="form-container">
      <div class="form-header">
        <h1>Welcome Back</h1>
        <p>Access the campus resource booking system</p>
      </div>
  
      <form class="login-form">
        <div class="logo-container">
          <div class="app-logo">
            <span class="logo-icon">🏫</span>
          </div>
        </div>
  
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email address" />
        </div>
  
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input">
            <input type="password" id="password" name="password" placeholder="Enter your password" />
            <span class="toggle-password">👁️</span>
          </div>
        </div>
  
        <div class="remember-forgot">
          <div class="remember-me">
            <input type="checkbox" id="remember" name="remember" />
            <label for="remember" class="checkbox-label">Remember me</label>
          </div>
          <a routerLink="/reset" class="forgot-password">Forgot Password?</a>
        </div>
  
        <div class="message-container" id="success-message">
          <div class="success-message">
            <i class="success-icon">✓</i>
            <span>Login successful! Redirecting...</span>
          </div>
        </div>
  
        <div class="message-container" id="error-message">
          <div class="error-message">
            <i class="error-icon">⚠️</i>
            <span>Invalid email or password. Please try again.</span>
          </div>
        </div>
  
        <button type="submit" class="submit-btn">Log In</button>
  
        <div class="register-link">
            <p>Do not have an account?<a routerLink="/register" class="anchor">Sign up here</a></p>
        </div>
  
        <div class="divider">
          <span>or continue with</span>
        </div>
  
        <div class="social-login">
          <button type="button" class="social-btn google">
            G
          </button>
          <button type="button" class="social-btn facebook">
            f
          </button>
          <button type="button" class="social-btn microsoft">
            M
          </button>
        </div>
      </form>
    </div>
  </div>
