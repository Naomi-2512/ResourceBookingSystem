<div class="profile">
    <div class="profileCard" *ngFor="let profile of profiles">
       <div class="profileImage">
         <img [src]="profile.image" alt="Profile Image">
       </div> 
       <div class="profileInfo">
        <h2>{{profile.name}}</h2>
        <h3>{{profile.location}}</h3>
        <p>{{profile.email}}</p>
       </div>
       <div class="phoneDiv">
        <div class="phone1">
            <h2>Phone 1</h2>
            <h4>{{profile.phone1}}</h4>
        </div>
        <div class="phone2">
            <h2>Phone 2</h2>
            <h4>{{profile.phone2}}</h4>

       </div>
    </div>
</div>
