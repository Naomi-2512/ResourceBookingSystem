<div class="profile-container">
    <div class="profile-card" *ngIf="!isEditMode">
      <div class="profile-header">
        <h1>User Profile</h1>
        <button class="action-button edit" (click)="toggleEditMode()">
          <i class="fas fa-edit"></i> Update Profile
        </button>
      </div>
      
      <div class="profile-content">
        <div class="profile-image">
          <img [src]="user.image" alt="Profile Image">
        </div>
        
        <div class="profile-details">
          <div class="detail-row">
            <div class="detail-label">
              <i class="fas fa-user"></i> Name
            </div>
            <div class="detail-value">
              {{user.firstName}} {{user.lastName}}
            </div>
          </div>
          
          <div class="detail-row">
            <div class="detail-label">
              <i class="fas fa-envelope"></i> Email
            </div>
            <div class="detail-value">
              {{user.email}}
            </div>
          </div>
          
          <div class="detail-row">
            <div class="detail-label">
              <i class="fas fa-phone"></i> Phone
            </div>
            <div class="detail-value">
              {{user.phoneNumber}}
            </div>
          </div>
          
          <div class="detail-row">
            <div class="detail-label">
              <i class="fas fa-map-marker-alt"></i> Location
            </div>
            <div class="detail-value">
              {{user.location}}
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="profile-edit-form" *ngIf="isEditMode">
      <div class="profile-header">
        <h1>Edit Profile</h1>
        <button class="action-button cancel" (click)="toggleEditMode()">
          <i class="fas fa-times"></i> Cancel
        </button>
      </div>
      
      <form (ngSubmit)="saveProfile()" [formGroup]="profileForm">
        <div class="form-image-container">
          <div class="form-image">
            <img [src]="user.image" alt="Profile Image">
            <div class="image-upload">
              <label for="profile-image">
                <i class="fas fa-camera"></i> Change Image
              </label>
              <input type="file" id="profile-image" accept="image/*" (change)="onImageChange($event)" style="display: none;">
            </div>
          </div>
        </div>
        
        <div class="form-group">
          <label for="firstName"><i class="fas fa-user"></i> First Name</label>
          <input type="text" id="firstName" formControlName="firstName" class="form-control">
          <div class="error-message" *ngIf="profileForm.get('firstName')?.invalid && profileForm.get('firstName')?.touched">
            First name is required
          </div>
        </div>
        
        <div class="form-group">
          <label for="lastName"><i class="fas fa-user"></i> Last Name</label>
          <input type="text" id="lastName" formControlName="lastName" class="form-control">
          <div class="error-message" *ngIf="profileForm.get('lastName')?.invalid && profileForm.get('lastName')?.touched">
            Last name is required
          </div>
        </div>
        
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="email" formControlName="email" class="form-control">
          <div class="error-message" *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched">
            Valid email is required
          </div>
        </div>
        
        <div class="form-group">
          <label for="phoneNumber"><i class="fas fa-phone"></i> Phone Number</label>
          <input type="tel" id="phoneNumber" formControlName="phoneNumber" class="form-control">
          <div class="error-message" *ngIf="profileForm.get('phoneNumber')?.invalid && profileForm.get('phoneNumber')?.touched">
            Valid phone number is required
          </div>
        </div>
        
        <div class="form-group">
          <label for="location"><i class="fas fa-map-marker-alt"></i> Location</label>
          <input type="text" id="location" formControlName="location" class="form-control">
          <div class="error-message" *ngIf="profileForm.get('location')?.invalid && profileForm.get('location')?.touched">
            Location is required
          </div>
        </div>
        
        <div class="form-actions">
          <button type="submit" class="save-button" [disabled]="profileForm.invalid">
            <i class="fas fa-save"></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
